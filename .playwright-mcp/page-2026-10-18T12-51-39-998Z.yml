            - generic [ref=e50]:
              - heading "01 Sklízení" [level=3] [ref=e52]
              - paragraph [ref=e53]: Naše káva pochází z mnoha oblastí, jako je např. Brazílie. Káva je ručně vybírána pro zajištění 100% kvality kávových zrn. Prostředí ve kterém je káva pěstována je velmi rozličné, některé druhy kávy jsou pěstovány na bahnitém a jiné na kamenitém podkladu za různých intenzit slunečního záření.
            - generic [ref=e60]:
              - heading "02 Pražení" [level=3] [ref=e62]
              - paragraph [ref=e63]: Pražení a balení kávy je jedním z hlavních procesů potřebných pro umocnění chuti a kvality kávy, proto naše káva pochází od malých nezávislých farmářů, kteří se o své výrobky skvěle pečují. Takto získaná káva následně podstoupí proces středního pražení pro maximální zisk chuti a následně ručně vybírána a balena.
            - generic [ref=e70]:
              - heading "03 Příprava" [level=3] [ref=e72]
              - paragraph [ref=e73]: Posledním krokem k dokonalé kávě je příprava. Každý milovník kávy má svůj oblíbený postup k přípravě kávy. Doporučujeme vyzkoušení přípravu kávy způsobem French Press
